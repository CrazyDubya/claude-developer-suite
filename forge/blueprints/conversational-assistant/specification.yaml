# Conversational Assistant Blueprint Specification

version: "1.0"
blueprint_id: "conversational-assistant"

# Formal specification of the blueprint
specification:
  name: "Conversational Assistant"
  version: "1.0.0"

  # Core capabilities this blueprint provides
  capabilities:
    - multi_turn_conversation
    - context_preservation
    - streaming_responses
    - configurable_personality
    - session_management

  # Required interfaces
  interfaces:
    input:
      type: "text"
      format: "user_message"
      max_length: 100000  # tokens

    output:
      type: "text"
      format: "assistant_response"
      streaming: true

  # State management
  state:
    conversation_history:
      type: "array"
      items: "message"
      max_items: 1000

    session_metadata:
      type: "object"
      properties:
        session_id: "string"
        created_at: "datetime"
        last_active: "datetime"
        message_count: "integer"

  # Configuration options
  configuration:
    model:
      type: "string"
      default: "claude-sonnet-4-20250514"
      options:
        - "claude-sonnet-4-20250514"
        - "claude-opus-4-20250514"
        - "claude-haiku-3-5-20241022"

    max_tokens:
      type: "integer"
      default: 4096
      min: 1
      max: 8192

    temperature:
      type: "number"
      default: 1.0
      min: 0.0
      max: 1.0

    system_prompt:
      type: "string"
      required: true

    context_window_strategy:
      type: "string"
      default: "sliding"
      options:
        - "full"        # Keep all history (may hit limits)
        - "sliding"     # Keep last N messages
        - "summary"     # Summarize older messages

    sliding_window_size:
      type: "integer"
      default: 20
      description: "Number of messages to keep when using sliding strategy"

  # Error handling
  errors:
    rate_limit:
      action: "exponential_backoff"
      max_retries: 3

    context_overflow:
      action: "truncate_or_summarize"

    api_error:
      action: "user_notification"

# Component specifications
components:
  assistant_core:
    responsibility: "Orchestrate conversation flow"
    methods:
      - name: "send_message"
        input: "user_message"
        output: "assistant_response"
        async: true

      - name: "get_history"
        output: "conversation_history"

      - name: "clear_history"
        output: "void"

  conversation_manager:
    responsibility: "Manage conversation state and context"
    methods:
      - name: "add_message"
        input: "message"

      - name: "get_context"
        output: "message_list"

      - name: "apply_context_strategy"
        description: "Apply sliding window or summary strategy"

  prompt_manager:
    responsibility: "Handle system and dynamic prompts"
    methods:
      - name: "get_system_prompt"
        output: "string"

      - name: "set_system_prompt"
        input: "string"

# Testing requirements
testing:
  unit_tests:
    - "test_message_send_receive"
    - "test_history_preservation"
    - "test_context_strategy"
    - "test_error_handling"

  integration_tests:
    - "test_multi_turn_conversation"
    - "test_session_persistence"
    - "test_streaming_output"

  validation_tests:
    - "test_response_quality"
    - "test_context_utilization"
